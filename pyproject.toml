[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcore-ab-release-gate"
version = "0.1.0"
description = "GitHub Action that deploys an ARM64 ECR image to AgentCore Runtime, runs a native A/B test, and promotes or rolls back based on managed evaluation results."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3==1.43.55",
    "botocore==1.43.55",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["agentcore_release_gate"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_action.py" = ["E402"]
"tests/test_report.py" = ["E402"]
