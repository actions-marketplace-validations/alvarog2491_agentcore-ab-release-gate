name: Bump README on release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-readme:
    name: Open PR with the released action version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Pin README examples to the release
        id: bump
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          SHA=$(git rev-list -n 1 "$TAG")
          python3 scripts/bump_readme_pin.py "$SHA" "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: bot/bump-readme-${{ steps.bump.outputs.tag }}
          base: main
          commit-message: "docs: pin README examples to ${{ steps.bump.outputs.tag }}"
          title: "docs: pin README examples to ${{ steps.bump.outputs.tag }}"
          body: |
            Updates the README action references to the immutable commit for
            release ${{ steps.bump.outputs.tag }}.
          delete-branch: true
